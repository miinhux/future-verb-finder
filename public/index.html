<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="직업보다 먼저, 내가 미래에 하고 싶은 동사를 찾아보는 진로 탐색 챗봇" />
  <title>미래 동사 · 진로 탐색</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <strong>미래 동사</strong>
          <span>CAREER CHAT</span>
        </div>
      </div>
      <div class="top-actions">
        <div id="apiBadge" class="api-badge pending">CareerNet 연결 확인 중</div>
        <button id="resetTopBtn" class="icon-btn" type="button" title="처음부터 다시 시작">↻</button>
      </div>
    </header>

    <main class="workspace">
      <section class="hero-panel">
        <div class="eyebrow">FNA · Function / Navigation / Action</div>
        <h1>직업을 고르기 전에,<br /><em>무엇을 하고 싶은지</em> 찾아봐.</h1>
        <p>챗봇처럼 대화하면서 너의 경험과 흥미에서 미래의 동사를 찾고, 실제 커리어넷 직업 정보까지 이어서 탐색해보자.</p>
        <div class="hero-pills">
          <span>미래 동사</span>
          <span>커리어넷 Open API</span>
          <span>챗봇 UX</span>
        </div>
      </section>

      <section class="chat-card" aria-label="미래 동사 진로 탐색 챗봇">
        <div class="chat-head">
          <div class="bot-avatar">🤖</div>
          <div class="chat-head-copy">
            <strong>미래 동사 친구</strong>
            <span id="stageLabel">탐색 시작</span>
          </div>
          <div class="progress-wrap">
            <span id="progressText">0 / 4</span>
            <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          </div>
        </div>

        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <div id="resultArea" class="result-area hidden"></div>
        <div id="choices" class="choices"></div>
        <div id="inputArea" class="input-area hidden">
          <input id="freeText" type="text" maxlength="120" placeholder="예: 문제를 직접 해결하는 게 재미있어" />
          <button id="sendTextBtn" type="button">보내기</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>진로정보는 CareerNet Open API를 통해 조회됩니다.</span>
      <span>프로토타입 · FNA 상태 흐름</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
